name: Publish Flatpak repository

on:
  workflow_dispatch:
  repository_dispatch:
    types: [resume-builder-release]

concurrency:
  group: publish-flatpak-repository
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Verify and pin Resume Builder release
        if: github.event_name == 'repository_dispatch'
        env:
          SOURCE_COMMIT: ${{ github.event.client_payload.source_commit }}
          RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
          RELEASE_VERSION: ${{ github.event.client_payload.version }}
        run: sh scripts/update-resume-builder-release.sh "$SOURCE_COMMIT" "$RELEASE_TAG" "$RELEASE_VERSION" "$(date -u +%F)"

      - name: Commit updated pin
        if: github.event_name == 'repository_dispatch'
        env:
          RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
        run: |
          if git diff --quiet; then
            echo "Resume Builder is already pinned to this release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/io.github.exolithelabs.ResumeBuilder.yml \
            metadata/io.github.exolithelabs.ResumeBuilder.metainfo.xml
          git commit -m "Publish Resume Builder $RELEASE_TAG"
          git push origin HEAD:main

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder gnupg ostree
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build manifests
        run: |
          shopt -s nullglob
          manifests=(manifests/*.yml manifests/*.yaml manifests/*.json)
          if [[ "${#manifests[@]}" -eq 0 ]]; then
            echo "No application manifests are connected yet."
            exit 1
          fi
          mkdir repo-fragment
          ostree init --repo=repo-fragment --mode=archive-z2
          for manifest in "${manifests[@]}"; do
            flatpak-builder --force-clean --disable-rofiles-fuse \
              --user \
              --arch="${{ matrix.arch }}" \
              --install-deps-from=flathub \
              --repo=repo-fragment \
              "build-${{ matrix.arch }}" "$manifest"
          done
          tar -czf "repo-${{ matrix.arch }}.tar.gz" repo-fragment

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repo-${{ matrix.arch }}
          path: repo-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: fragments

      - name: Install repository tooling
        run: sudo apt-get update && sudo apt-get install -y flatpak gnupg ostree

      - name: Import signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          mkdir -m 700 "${RUNNER_TEMP}/gnupg"
          key_id=$(sh scripts/import-signing-key.sh)
          echo "FLATPAK_GPG_KEY_ID=$key_id" >> "$GITHUB_ENV"

      - name: Combine and sign repository
        run: |
          mkdir combined-repo
          ostree init --repo=combined-repo --mode=archive-z2
          for archive in fragments/*/repo-*.tar.gz; do
            workdir=$(mktemp -d)
            tar -xzf "$archive" -C "$workdir"
            while IFS= read -r ref; do
              ostree pull-local --repo=combined-repo "$workdir/repo-fragment" "$ref"
            done < <(ostree refs --repo="$workdir/repo-fragment")
            rm -rf "$workdir"
          done
          while IFS= read -r ref; do
            commit=$(ostree rev-parse --repo=combined-repo "$ref")
            ostree gpg-sign --repo=combined-repo "$commit" "$FLATPAK_GPG_KEY_ID"
          done < <(ostree refs --repo=combined-repo)

          flatpak build-update-repo --generate-static-deltas \
            --gpg-sign="$FLATPAK_GPG_KEY_ID" combined-repo
          public_key=$(gpg --batch --export "$FLATPAK_GPG_KEY_ID" | base64 --wrap=0)
          sh scripts/render-site.sh public combined-repo "$public_key"

      - name: Remove signing material from runner
        if: always()
        run: |
          rm -rf -- "${GNUPGHOME:?}"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
